services:
  db:
    image: postgis/postgis:16-3.4
    container_name: skyhaler-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skyhaler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skyhaler}
      POSTGRES_DB: ${POSTGRES_DB:-skyhaler}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - skyhaler_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skyhaler} -d ${POSTGRES_DB:-skyhaler}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skyhaler_pgdata:
